<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0a0f" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="moodie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<title>moodie</title>
<style>
/* ===== ROOT & RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ===== THEME SYSTEM ===== */
:root[data-theme="dark"],
:root[data-theme="system"] {
  --bg-deep:#0c0a0f;
  --bg-mid:#13111a;
  --bg-warm:#1a1824;
  --surface:rgba(255,255,255,.04);
  --glass:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.1);
  --fg:#f0eef5;
  --fg-soft:#b8b4c8;
  --muted:#7a7890;
  --subtle:rgba(255,255,255,.15);
  --accent:#c8a4f0;
  --accent-soft:rgba(200,164,240,.15);
  --accent-warm:rgba(200,164,240,.08);
  --shadow:0 8px 32px rgba(0,0,0,.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,.4);
}
:root[data-theme="light"] {
  --bg-deep:#faf8f5;
  --bg-mid:#f5f2ed;
  --bg-warm:#ede9e2;
  --surface:rgba(0,0,0,.03);
  --glass:rgba(0,0,0,.04);
  --glass-border:rgba(0,0,0,.08);
  --fg:#1a1814;
  --fg-soft:#4a4740;
  --muted:#8a8778;
  --subtle:rgba(0,0,0,.12);
  --accent:#8b5cf6;
  --accent-soft:rgba(139,92,246,.12);
  --accent-warm:rgba(139,92,246,.06);
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12);
}

@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --bg-deep:#faf8f5;
    --bg-mid:#f5f2ed;
    --bg-warm:#ede9e2;
    --surface:rgba(0,0,0,.03);
    --glass:rgba(0,0,0,.04);
    --glass-border:rgba(0,0,0,.08);
    --fg:#1a1814;
    --fg-soft:#4a4740;
    --muted:#8a8778;
    --subtle:rgba(0,0,0,.12);
    --accent:#8b5cf6;
    --accent-soft:rgba(139,92,246,.12);
    --accent-warm:rgba(139,92,246,.06);
    --shadow:0 4px 20px rgba(0,0,0,.08);
    --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  }
}

/* Mood colors - same in both themes */
:root {
  --great:#6ee7b7;
  --great-soft:rgba(110,231,183,.18);
  --good:#5eead4;
  --good-soft:rgba(94,234,212,.18);
  --fine:#fdba74;
  --fine-soft:rgba(253,186,116,.18);
  --bad:#fb7185;
  --bad-soft:rgba(251,113,133,.18);
  --awful:#f43f5e;
  --awful-soft:rgba(244,63,94,.18);
}

/* ===== BASE ===== */
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg-deep);transition:background .6s,color .6s}
body{position:relative}

/* Background aurora */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 120% 80% at 20% 40%,rgba(139,92,246,.1),transparent 60%),radial-gradient(ellipse 100% 60% at 80% 80%,rgba(236,72,153,.06),transparent 50%),radial-gradient(ellipse 80% 50% at 50% 0%,rgba(34,211,238,.05),transparent 50%);pointer-events:none;z-index:0;animation:aurora 20s ease-in-out infinite}
@keyframes aurora{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.05) translateX(-2%)}}

.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;z-index:1}

/* ===== TYPOGRAPHY ===== */
.font-serif{font-family:'Playfair Display',Georgia,serif}

/* ===== FLOATING ORBS ===== */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.4}
.orb-1{width:300px;height:300px;background:rgba(139,92,246,.15);top:10%;left:-10%;animation:orbFloat1 25s ease-in-out infinite}
.orb-2{width:250px;height:250px;background:rgba(236,72,153,.1);top:60%;right:-5%;animation:orbFloat2 30s ease-in-out infinite}
.orb-3{width:200px;height:200px;background:rgba(34,211,238,.08);bottom:10%;left:20%;animation:orbFloat3 35s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,15px) scale(.95)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-25px,30px) scale(1.05)}66%{transform:translate(15px,-25px) scale(1.1)}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,25px) scale(1.15)}66%{transform:translate(-30px,-15px) scale(.9)}}

/* ===== HEADER ===== */
.header{flex-shrink:0;padding:24px 24px 16px;position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:40% 60% 50% 50% / 50% 40% 60% 50%;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 20px rgba(139,92,246,.3);animation:glowPulse 3s ease-in-out infinite}
.logo-text{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--fg);font-family:'Playfair Display',serif}
.header-actions{display:flex;align-items:center;gap:8px}
.theme-toggle-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .4s;color:var(--muted);backdrop-filter:blur(20px)}
.theme-toggle-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);transform:rotate(180deg)}
.settings-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .4s;color:var(--muted);backdrop-filter:blur(20px)}
.settings-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

@keyframes glowPulse{0%,100%{box-shadow:0 4px 20px rgba(139,92,246,.3)}50%{box-shadow:0 4px 40px rgba(139,92,246,.5)}}

/* ===== MAIN ===== */
.main{flex:1;position:relative;overflow:hidden}
.panels{height:100%;display:flex;transition:transform .6s cubic-bezier(.22,1,.36,1);touch-action:pan-y}
.panel{min-width:100%;height:100%;padding:0 24px 24px;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.panel::-webkit-scrollbar{width:0}
.panel-content{padding-top:8px;padding-bottom:100px}
.section{margin-bottom:28px;opacity:0;transform:translateY(24px);animation:reveal .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes reveal{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* ===== GARDEN ===== */
.garden-container{position:relative;margin-bottom:24px}
.garden-bed{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:32px 20px 20px;position:relative}
.garden-bed::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:40px;background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(139,92,246,.08),transparent);border-radius:50%}
.garden-spot{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .5s cubic-bezier(.22,1,.36,1);position:relative;z-index:1}
.garden-spot:hover{transform:translateY(-4px)}
.garden-spot:active{transform:scale(.95)}
.garden-spot-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;transition:color .3s}
.garden-spot:hover .garden-spot-label{color:var(--accent)}

/* Soil mound */
.soil-mound{width:64px;height:32px;border-radius:50%;background:linear-gradient(180deg,#3d2f1f,#2a1f14);position:relative;transition:all .5s}
.soil-mound::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:80%;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(61,47,31,.8),transparent)}

/* Flower animations */
@keyframes flowerSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes seedPulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
@keyframes sproutGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

/* Flower containers */
.flower-container{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:48px;height:60px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}

/* Sunflower - Great */
.flower-sunflower .flower-stem{width:3px;height:24px;background:linear-gradient(180deg,#4ade80,#22c55e);border-radius:2px;transform-origin:bottom;animation:flowerSway 4s ease-in-out infinite}
.flower-sunflower .flower-head{width:28px;height:28px;background:radial-gradient(circle,#fbbf24,#f59e0b);border-radius:50%;position:absolute;top:0;left:50%;transform:translateX(-50%);box-shadow:0 0 12px rgba(251,191,36,.3)}
.flower-sunflower .flower-head::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#78350f;opacity:.3}
.flower-sunflower .petal{position:absolute;width:8px;height:12px;background:#fbbf24;border-radius:50%;top:50%;left:50%;transform-origin:center bottom}

/* Daisy - Good */
.flower-daisy .flower-stem{width:3px;height:20px;background:linear-gradient(180deg,#34d399,#10b981);border-radius:2px;transform-origin:bottom;animation:flowerSway 5s ease-in-out infinite}
.flower-daisy .flower-head{width:22px;height:22px;background:#fef3c7;border-radius:50%;position:absolute;top:6px;left:50%;transform:translateX(-50%);box-shadow:0 0 10px rgba(254,243,199,.3)}
.flower-daisy .flower-center{width:8px;height:8px;background:#f59e0b;border-radius:50%;position:absolute;top:12px;left:50%;transform:translateX(-50%)}

/* Lavender - Fine */
.flower-lavender .flower-stem{width:2px;height:28px;background:linear-gradient(180deg,#a78bfa,#7c3aed);border-radius:2px;transform-origin:bottom;animation:flowerSway 3.5s ease-in-out infinite}
.flower-lavender .spike{position:absolute;width:6px;height:14px;background:linear-gradient(180deg,#c4b5fd,#a78bfa);border-radius:3px;top:2px;left:50%;transform:translateX(-50%)}
.flower-lavender .spike::before{content:'';position:absolute;width:4px;height:10px;background:linear-gradient(180deg,#ddd6fe,#c4b5fd);border-radius:2px;top:8px;left:50%;transform:translateX(-50%)}

/* Rain lily - Bad */
.flower-rainlily .flower-stem{width:2px;height:22px;background:linear-gradient(180deg,#fb923c,#ea580c);border-radius:2px;transform-origin:bottom;animation:flowerSway 4.5s ease-in-out infinite}
.flower-rainlily .flower-head{width:20px;height:20px;background:#fecaca;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;position:absolute;top:4px;left:50%;transform:translateX(-50%);box-shadow:0 0 8px rgba(254,202,202,.3)}

/* Bluebell - Awful */
.flower-bluebell .flower-stem{width:2px;height:26px;background:linear-gradient(180deg,#818cf8,#4f46e5);border-radius:2px;transform-origin:bottom;animation:flowerSway 5.5s ease-in-out infinite}
.flower-bluebell .flower-head{width:10px;height:14px;background:linear-gradient(180deg,#a5b4fc,#6366f1);border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;position:absolute;top:2px;left:50%;transform:translateX(-50%);box-shadow:0 0 8px rgba(165,180,252,.3)}

/* Seed state */
.seed{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.4;position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
.seed.pulse{animation:seedPulse 3s ease-in-out infinite}

/* Sprout state */
.sprout{width:3px;height:10px;border-radius:2px;background:linear-gradient(180deg,var(--great),var(--good));position:absolute;top:-12px;left:50%;transform:translateX(-50%) scaleY(0);transform-origin:bottom}
.sprout.grow{animation:sproutGrow .8s cubic-bezier(.22,1,.36,1) forwards}

/* Garden title */
.garden-title{text-align:center;margin-top:16px}
.garden-title h1{font-size:32px;font-weight:600;font-family:'Playfair Display',serif;letter-spacing:-.5px;line-height:1.2}
.garden-title p{font-size:15px;color:var(--muted);margin-top:6px;font-weight:400}

/* ===== TIMELINE ===== */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:1px}
.timeline-entry{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1)}
.timeline-entry:hover{transform:translateX(4px)}
.timeline-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px;position:relative;z-index:1;border:3px solid var(--bg-deep);transition:all .3s}
.timeline-entry:hover .timeline-dot{transform:scale(1.2)}
.timeline-dot.great{background:var(--great);box-shadow:0 0 8px var(--great-soft)}
.timeline-dot.good{background:var(--good);box-shadow:0 0 8px var(--good-soft)}
.timeline-dot.fine{background:var(--fine);box-shadow:0 0 8px var(--fine-soft)}
.timeline-dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad-soft)}
.timeline-dot.awful{background:var(--awful);box-shadow:0 0 8px var(--awful-soft)}
.timeline-content{flex:1;background:var(--surface);border:1px solid var(--glass-border);border-radius:20px;padding:14px 16px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.timeline-content::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.timeline-time{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.timeline-mood{font-size:16px;font-weight:600;font-family:'Playfair Display',serif;margin-bottom:2px}
.timeline-emotion{font-size:13px;color:var(--fg-soft)}
.timeline-activity{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== BOTTOM NAV ===== */
.bottom-nav{flex-shrink:0;display:flex;justify-content:space-around;padding:12px 24px 32px;background:linear-gradient(0deg,var(--bg-mid) 0%,transparent 100%);position:relative;z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);border-radius:20px;background:transparent;border:none;color:inherit;font:inherit;position:relative}
.nav-item:hover{background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{color:var(--accent);transform:translateY(-2px)}
.nav-icon{font-size:20px;color:var(--muted);transition:all .4s}
.nav-label{font-size:10px;font-weight:600;color:var(--muted);transition:color .4s;letter-spacing:.5px}
.nav-item.active .nav-label{color:var(--accent)}
.nav-glow{position:absolute;top:4px;width:24px;height:3px;background:var(--accent);border-radius:2px;opacity:0;transition:opacity .4s;box-shadow:0 0 12px var(--accent)}
.nav-item.active .nav-glow{opacity:1}

/* ===== SWIPE MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:100}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;background:var(--bg-deep);z-index:101;transform:scale(.95);opacity:0;visibility:hidden;pointer-events:none;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s,visibility .5s;overflow:hidden}
.modal.open{transform:scale(1);opacity:1;visibility:visible;pointer-events:auto}
.modal-header{position:absolute;top:0;left:0;right:0;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.modal-close{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .4s;color:var(--muted);backdrop-filter:blur(20px)}
.modal-close:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);transform:rotate(90deg)}
.modal-pages{height:100%;display:flex;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.modal-page{min-width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 32px 40px;overflow-y:auto}
.page-dots{display:flex;gap:8px;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:10}
.page-dot{width:8px;height:8px;border-radius:50%;background:var(--glass-border);transition:all .4s}
.page-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent-soft);width:24px;border-radius:4px}

/* Mood Page */
.mood-question{font-size:28px;font-weight:600;font-family:'Playfair Display',serif;text-align:center;margin-bottom:8px;max-width:280px;line-height:1.3}
.mood-subtitle{font-size:15px;color:var(--muted);text-align:center;margin-bottom:40px}
.mood-orbs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:320px}
.mood-orb{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:all .5s cubic-bezier(.22,1,.36,1);position:relative;backdrop-filter:blur(10px);border:2px solid transparent}
.mood-orb:hover{transform:translateY(-6px) scale(1.1)}
.mood-orb:active{transform:scale(.95)}
.mood-orb.great{background:var(--great-soft);box-shadow:0 0 24px var(--great-soft)}
.mood-orb.good{background:var(--good-soft);box-shadow:0 0 24px var(--good-soft)}
.mood-orb.fine{background:var(--fine-soft);box-shadow:0 0 24px var(--fine-soft)}
.mood-orb.bad{background:var(--bad-soft);box-shadow:0 0 24px var(--bad-soft)}
.mood-orb.awful{background:var(--awful-soft);box-shadow:0 0 24px var(--awful-soft)}
.mood-orb-label{position:absolute;bottom:-24px;font-size:11px;font-weight:600;text-transform:capitalize;color:var(--muted);letter-spacing:.5px;opacity:0;transform:translateY(4px);transition:all .3s}
.mood-orb:hover .mood-orb-label{opacity:1;transform:translateY(0)}

/* Emotion Page */
.emotion-container{width:100%;max-width:360px}
.emotion-step{margin-bottom:32px}
.emotion-step-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.emotion-options{display:flex;flex-wrap:wrap;gap:10px}
.emotion-chip{padding:12px 20px;border-radius:30px;border:1px solid var(--glass-border);background:var(--surface);font-size:14px;font-weight:500;color:var(--fg-soft);cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);font-family:inherit;backdrop-filter:blur(10px)}
.emotion-chip:hover{border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
.emotion-chip:active{transform:scale(.95)}
.emotion-chip.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 4px 16px var(--accent-soft)}

/* Activity Page */
.activity-container{width:100%;max-width:360px;text-align:center}
.activity-question{font-size:24px;font-weight:600;font-family:'Playfair Display',serif;margin-bottom:8px}
.activity-subtitle{font-size:15px;color:var(--muted);margin-bottom:32px}
.activity-input{width:100%;padding:18px 20px;font-size:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;color:var(--fg);font-family:inherit;transition:all .4s;backdrop-filter:blur(10px);margin-bottom:24px}
.activity-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.activity-input::placeholder{color:var(--subtle);font-family:'Playfair Display',serif;font-style:italic}
.plant-btn{width:100%;padding:18px;border-radius:20px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:var(--bg-deep);box-shadow:0 4px 20px rgba(139,92,246,.2);font-family:inherit}
.plant-btn:hover{box-shadow:0 8px 32px rgba(139,92,246,.35);transform:translateY(-2px)}
.plant-btn:active{transform:scale(.97)}

/* Bloom Animation */
.bloom-overlay{position:fixed;inset:0;z-index:200;pointer-events:none;display:flex;align-items:center;justify-content:center}
.bloom-flower{font-size:120px;animation:bloomAnim 1.2s cubic-bezier(.22,1,.36,1) forwards;opacity:0}
@keyframes bloomAnim{0%{opacity:0;transform:scale(0) rotate(-20deg)}50%{opacity:1;transform:scale(1.2) rotate(5deg)}100%{opacity:0;transform:scale(1.5) rotate(0deg) translateY(-100px)}}

/* ===== HISTORY ===== */
.history-week{margin-bottom:32px}
.history-week-header{font-size:20px;font-weight:600;font-family:'Playfair Display',serif;margin-bottom:16px;padding:0 4px}
.history-week-header span{color:var(--muted);font-weight:400;font-size:14px;margin-left:10px;font-family:-apple-system,sans-serif}

/* ===== REVIEW GARDEN ===== */
.review-garden{display:flex;gap:20px;padding:8px 0;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.review-garden::-webkit-scrollbar{height:0}
.review-week{flex-shrink:0;width:280px;scroll-snap-align:start}
.review-week-bed{background:var(--surface);border:1px solid var(--glass-border);border-radius:28px;padding:24px 20px;backdrop-filter:blur(20px);position:relative;overflow:hidden;min-height:320px}
.review-week-bed::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(180deg,transparent,rgba(139,92,246,.04));border-radius:0 0 28px 28px}
.review-week-title{font-size:16px;font-weight:600;margin-bottom:4px;font-family:'Playfair Display',serif}
.review-week-dates{font-size:13px;color:var(--muted);margin-bottom:20px}
.review-week-flowers{display:flex;justify-content:center;align-items:flex-end;gap:12px;height:180px;position:relative}
.review-week-flowers::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:30px;background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(61,47,31,.3),transparent);border-radius:50%}

/* ===== SETTINGS ===== */
.settings-blob{background:var(--surface);border:1px solid var(--glass-border);border-radius:40% 60% 50% 50% / 50% 40% 60% 50%;padding:24px 20px;margin-bottom:16px;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:all .4s cubic-bezier(.22,1,.36,1)}
.settings-blob:hover{border-color:rgba(255,255,255,.12);transform:translateY(-2px)}
.settings-blob::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.settings-blob-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.theme-options{display:flex;gap:10px}
.theme-option{flex:1;padding:14px 8px;border-radius:16px;border:2px solid var(--glass-border);background:var(--glass);text-align:center;cursor:pointer;transition:all .4s;font-family:inherit;font-size:13px;font-weight:600;color:var(--fg-soft)}
.theme-option:hover{border-color:rgba(255,255,255,.15)}
.theme-option:active{transform:scale(.95)}
.theme-option.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 4px 16px var(--accent-soft)}
.theme-option-icon{font-size:20px;display:block;margin-bottom:4px}

/* ===== EMPTY STATES ===== */
.empty-state{text-align:center;padding:64px 32px}
.empty-illustration{width:120px;height:120px;margin:0 auto 28px;opacity:.7}
.empty-title{font-size:24px;font-weight:600;font-family:'Playfair Display',serif;margin-bottom:10px}
.empty-text{font-size:15px;color:var(--muted);line-height:1.6;max-width:300px;margin:0 auto}

/* ===== TOAST ===== */
.toast-container{position:fixed;bottom:120px;left:24px;right:24px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.toast{background:var(--surface);color:var(--fg);padding:16px 24px;border-radius:20px;font-size:15px;font-weight:500;opacity:0;transform:translateY(24px) scale(.95);transition:all .6s cubic-bezier(.22,1,.36,1);pointer-events:auto;box-shadow:0 16px 48px rgba(0,0,0,.3);border:1px solid var(--glass-border);display:flex;align-items:center;gap:12px;max-width:100%;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateY(0) scale(1)}

/* ===== CONFIRM ===== */
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s;z-index:150;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-backdrop.open{opacity:1;pointer-events:auto}
.confirm-dialog{background:var(--bg-mid);border:1px solid var(--glass-border);border-radius:28px;padding:32px;max-width:340px;width:100%;text-align:center;transform:scale(.9);transition:transform .5s cubic-bezier(.22,1,.36,1);box-shadow:0 24px 64px rgba(0,0,0,.4)}
.confirm-backdrop.open .confirm-dialog{transform:scale(1)}
.confirm-icon{font-size:56px;margin-bottom:20px}
.confirm-title{font-size:20px;font-weight:600;margin-bottom:10px;font-family:'Playfair Display',serif}
.confirm-text{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.confirm-actions{display:flex;gap:12px}
.confirm-btn{flex:1;padding:16px;border-radius:16px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .4s}
.confirm-btn:active{transform:scale(.97)}
.confirm-btn.cancel{background:var(--surface);color:var(--fg-soft);border:1px solid var(--glass-border)}
.confirm-btn.danger{background:var(--awful-soft);color:var(--awful);border:1px solid rgba(244,63,94,.2)}

/* ===== REPORT ===== */
.report-view{position:fixed;inset:0;background:var(--bg-deep);z-index:300;overflow-y:auto}
.report-content{max-width:480px;margin:0 auto;padding:32px 28px 56px}
.report-header{text-align:center;margin-bottom:32px}
.report-app-name{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:4px;margin-bottom:8px}
.report-title{font-size:28px;font-weight:600;font-family:'Playfair Display',serif}
.report-dates{font-size:15px;color:var(--muted);margin-top:8px}
.report-close{position:fixed;top:24px;right:24px;z-index:301;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--fg);transition:all .4s;backdrop-filter:blur(20px)}
.report-close:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);transform:rotate(90deg) scale(1.1)}

/* ===== ANIMATIONS ===== */
@keyframes aurora{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.05) translateX(-2%)}}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,15px) scale(.95)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-25px,30px) scale(1.05)}66%{transform:translate(15px,-25px) scale(1.1)}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,25px) scale(1.15)}66%{transform:translate(-30px,-15px) scale(.9)}}
@keyframes glowPulse{0%,100%{box-shadow:0 4px 20px rgba(139,92,246,.3)}50%{box-shadow:0 4px 40px rgba(139,92,246,.5)}}
@keyframes reveal{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes seedPulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
@keyframes sproutGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes flowerSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bloomAnim{0%{opacity:0;transform:scale(0) rotate(-20deg)}50%{opacity:1;transform:scale(1.2) rotate(5deg)}100%{opacity:0;transform:scale(1.5) rotate(0deg) translateY(-100px)}}

/* Accessibility */
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
button:focus-visible{border-radius:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
// ===== DATA MODEL =====
const SLOTS = [
  { key: '09:00', label: 'Morning', time: '9:00 AM' },
  { key: '14:00', label: 'Afternoon', time: '2:00 PM' },
  { key: '18:00', label: 'Evening', time: '6:00 PM' },
  { key: '21:00', label: 'Night', time: '9:00 PM' }
];
const MOODS = ['great','good','fine','bad','awful'];
const MOOD_FACES = { great:'😄', good:'🙂', fine:'😐', bad:'😔', awful:'😢' };
const MOOD_VALUES = { great:5, good:4, fine:3, bad:2, awful:1 };
const MOOD_FLOWERS = { great:'sunflower', good:'daisy', fine:'lavender', bad:'rainlily', awful:'bluebell' };
const MOOD_EMOJI = { great:'🌻', good:'🌼', fine:'🪻', bad:'🌷', awful:'🔔' };

const WHEEL = {
  happy: {
    label:'Happy', icon:'😊',
    children: {
      excited:{ label:'Excited', children:{ energetic:'Energetic', eager:'Eager' }},
      creative:{ label:'Creative', children:{ inspired:'Inspired', amazed:'Amazed' }},
      playful:{ label:'Playful', children:{ cheeky:'Cheeky', free:'Free' }},
      content:{ label:'Content', children:{ curious:'Curious', joyful:'Joyful' }},
      proud:{ label:'Proud', children:{ successful:'Successful', appreciated:'Appreciated' }},
      accepted:{ label:'Accepted', children:{ respected:'Respected', valued:'Valued' }}
    }
  },
  sad: {
    label:'Sad', icon:'😢',
    children: {
      lonely:{ label:'Lonely', children:{ isolated:'Isolated', abandoned:'Abandoned' }},
      guilty:{ label:'Guilty', children:{ ashamed:'Ashamed', remorseful:'Remorseful' }},
      despairing:{ label:'Despairing', children:{ powerless:'Powerless', grief:'Grief' }},
      bored:{ label:'Bored', children:{ apathetic:'Apathetic', indifferent:'Indifferent' }},
      embarrassed:{ label:'Embarrassed', children:{ humiliated:'Humiliated', foolish:'Foolish' }},
      depressed:{ label:'Depressed', children:{ empty:'Empty', inferior:'Inferior' }}
    }
  },
  angry: {
    label:'Angry', icon:'😤',
    children: {
      irritated:{ label:'Irritated', children:{ aggravated:'Aggravated', annoyed:'Annoyed' }},
      hostile:{ label:'Hostile', children:{ selfcentered:'Self-centered', jealous:'Jealous' }},
      frustrated:{ label:'Frustrated', children:{ infuriated:'Infuriated', enraged:'Enraged' }},
      provoked:{ label:'Provoked', children:{ furious:'Furious', bitter:'Bitter' }},
      resentful:{ label:'Resentful', children:{ violated:'Violated', indignant:'Indignant' }},
      critical:{ label:'Critical', children:{ dismissive:'Dismissive', skeptical:'Skeptical' }}
    }
  },
  scared: {
    label:'Scared', icon:'😨',
    children: {
      confused:{ label:'Confused', children:{ disillusioned:'Disillusioned', perplexed:'Perplexed' }},
      rejected:{ label:'Rejected', children:{ bewildered:'Bewildered', discouraged:'Discouraged' }},
      helpless:{ label:'Helpless', children:{ incapable:'Incapable', paralyzed:'Paralyzed' }},
      anxious:{ label:'Anxious', children:{ overwhelmed:'Overwhelmed', worried:'Worried' }},
      insecure:{ label:'Insecure', children:{ inadequate:'Inadequate', inferior:'Inferior' }},
      nervous:{ label:'Nervous', children:{ tense:'Tense', uneasy:'Uneasy' }}
    }
  },
  powerful: {
    label:'Powerful', icon:'💪',
    children: {
      important:{ label:'Important', children:{ valuable:'Valuable', worthwhile:'Worthwhile' }},
      faithful:{ label:'Faithful', children:{ trusting:'Trusting', loyal:'Loyal' }},
      sure:{ label:'Sure', children:{ certain:'Certain', positive:'Positive' }},
      confident:{ label:'Confident', children:{ assertive:'Assertive', bold:'Bold' }},
      aware:{ label:'Aware', children:{ conscious:'Conscious', mindful:'Mindful' }},
      discerning:{ label:'Discerning', children:{ astute:'Astute', logical:'Logical' }}
    }
  },
  peaceful: {
    label:'Peaceful', icon:'🕊️',
    children: {
      intimate:{ label:'Intimate', children:{ romantic:'Romantic', sensitive:'Sensitive' }},
      loving:{ label:'Loving', children:{ affectionate:'Affectionate', tender:'Tender' }},
      thankful:{ label:'Thankful', children:{ appreciative:'Appreciative', blessed:'Blessed' }},
      serene:{ label:'Serene', children:{ calm:'Calm', clear:'Clear' }},
      hopeful:{ label:'Hopeful', children:{ fulfilled:'Fulfilled', expectant:'Expectant' }},
      nurturing:{ label:'Nurturing', children:{ caring:'Caring', compassionate:'Compassionate' }}
    }
  }
};

function loadData(){ try{ const d=localStorage.getItem('moodie_data'); if(!d) return {entries:{}}; return JSON.parse(d); }catch{ return {entries:{}}; } }
function saveData(data){ localStorage.setItem('moodie_data',JSON.stringify(data)); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function getEntry(data,date,slotKey){ return (data.entries[date]&&data.entries[date][slotKey])||null; }
function setEntry(data,date,slotKey,entry){ if(!data.entries[date])data.entries[date]={}; data.entries[date][slotKey]=entry; }

let currentPanel=0;
let currentModalPage=0;
let editingDate=null;
let editingSlot=null;
let selectedMood=null;
let selectedCore=null;
let selectedSpecific=null;
let selectedNuanced=null;
let emotionStep=0;
let confirmCallback=null;

// ===== THEME SYSTEM =====
function initTheme(){
  const saved = localStorage.getItem('moodie_theme') || 'system';
  applyTheme(saved);
}
function applyTheme(theme){
  const root = document.documentElement;
  root.setAttribute('data-theme', theme);
  localStorage.setItem('moodie_theme', theme);
  // Update meta theme-color
  const isLight = theme === 'light' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.getElementById('themeMeta').setAttribute('content', isLight ? '#faf8f5' : '#0c0a0f');
  // Update theme selector
  document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('selected'));
  const btn = document.getElementById('theme' + theme.charAt(0).toUpperCase() + theme.slice(1));
  if(btn) btn.classList.add('selected');
}
function setTheme(theme){ applyTheme(theme); closeThemeMenu(); showToast('Theme updated',{icon:'✨'}); }
function toggleThemeMenu(){
  initTheme();
  document.getElementById('themeBackdrop').classList.add('open');
  document.getElementById('themeModal').classList.add('open');
}
function closeThemeMenu(){
  document.getElementById('themeBackdrop').classList.remove('open');
  document.getElementById('themeModal').classList.remove('open');
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if(localStorage.getItem('moodie_theme') === 'system') applyTheme('system');
});

// ===== UTILS =====
function haptic(t){ if('vibrate'in navigator) navigator.vibrate(t==='error'?[50,30,50]:10); }
function announce(t){ const l=document.getElementById('srLive'); if(!l)return; l.textContent=''; setTimeout(()=>l.textContent=t,50); }
function showToast(msg,opts={}){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
  let h=''; if(opts.icon) h+=`<span>${opts.icon}</span>`; h+=`<span>${msg}</span>`;
  t.innerHTML=h; c.appendChild(t); announce(msg);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),400); },opts.duration||2500);
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
}
function formatDateShort(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function getNextSlot(){
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  for(const s of SLOTS){ const [h,m]=s.key.split(':').map(Number); if(mins<h*60+m) return s; }
  return null;
}

// ===== PANEL NAVIGATION =====
function goToPanel(n){
  if(n===currentPanel)return;
  currentPanel=n;
  document.getElementById('panels').style.transform=`translateX(-${n*100}%)`;
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active',i===n);
  });
  haptic('light');
  if(n===0) renderToday();
  if(n===1) renderHistory();
  if(n===2) renderReview();
  if(n===3) renderSettings();
}
let sx=0,sy=0;
const mainC=document.getElementById('mainContainer');
mainC.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
mainC.addEventListener('touchend',e=>{
  const dx=sx-e.changedTouches[0].clientX;
  const dy=sy-e.changedTouches[0].clientY;
  if(Math.abs(dx)>60&&Math.abs(dy)<100){
    if(dx>0&&currentPanel<3)goToPanel(currentPanel+1);
    if(dx<0&&currentPanel>0)goToPanel(currentPanel-1);
  }
},{passive:true});

// ===== TODAY SCREEN =====
function renderToday(){
  const data=loadData();
  const date=todayKey();
  const container=document.getElementById('todayContent');
  const next=getNextSlot();
  let filled=0;
  SLOTS.forEach(s=>{ if(getEntry(data,date,s.key)) filled++; });

  let html='';

  // Garden
  html+='<div class="section" style="animation-delay:0s"><div class="garden-container">';
  html+='<div class="garden-bed">';
  SLOTS.forEach(s=>{
    const entry=getEntry(data,date,s.key);
    const isNext=next&&next.key===s.key;
    html+='<div class="garden-spot" onclick="openCheckin(' + "'" + date + "','" + s.key + "')" + '">';
    html+='<div class="soil-mound">';
    if(entry){
      const flowerClass='flower-'+MOOD_FLOWERS[entry.mood];
      html+='<div class="flower-container ' + flowerClass + '">';
      html+='<div class="flower-stem"></div>';
      html+='<div class="flower-head"></div>';
      if(flowerClass==='flower-daisy') html+='<div class="flower-center"></div>';
      if(flowerClass==='flower-lavender'){ html+='<div class="spike"></div>'; }
      html+='</div>';
    } else if(isNext){
      html+='<div class="seed pulse"></div>';
    } else {
      html+='<div class="seed"></div>';
    }
    html+='</div>';
    html+='<span class="garden-spot-label">' + s.label + '</span>';
    html+='</div>';
  });
  html+='</div>';

  // Garden title
  html+='<div class="garden-title">';
  if(filled===0){
    html+='<h1 class="font-serif">A new day begins</h1>';
    html+='<p>Your garden awaits its first flower</p>';
  } else if(filled===4){
    html+='<h1 class="font-serif">Your garden blooms</h1>';
    html+='<p>All four flowers have been planted</p>';
  } else {
    html+='<h1 class="font-serif">' + filled + ' of 4 flowers</h1>';
    html+='<p>Keep nurturing your garden</p>';
  }
  html+='</div></div></div>';

  // Timeline
  if(filled>0){
    html+='<div class="section" style="animation-delay:.1s"><div class="section-title">Today</div><div class="timeline">';
    SLOTS.forEach(s=>{
      const e=getEntry(data,date,s.key);
      if(e){
        html+='<div class="timeline-entry" onclick="openCheckin(' + "'" + date + "','" + s.key + "')" + '">';
        html+='<div class="timeline-dot ' + e.mood + '"></div>';
        html+='<div class="timeline-content">';
        html+='<div class="timeline-time">' + s.time + '</div>';
        html+='<div class="timeline-mood font-serif">' + e.mood + '</div>';
        html+='<div class="timeline-emotion">' + (e.nuanced||e.specific||e.core) + '</div>';
        if(e.activity) html+='<div class="timeline-activity">' + escHtml(e.activity) + '</div>';
        html+='</div></div>';
      }
    });
    html+='</div></div>';
  }

  if(filled===0){
    html+='<div class="section" style="animation-delay:.2s"><div class="empty-state">';
    html+='<svg class="empty-illustration" viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="45" stroke="rgba(200,164,240,.3)" stroke-width="1.5"/><circle cx="60" cy="60" r="30" stroke="rgba(200,164,240,.2)" stroke-width="1"/><circle cx="60" cy="60" r="15" fill="rgba(200,164,240,.15)"/><circle cx="60" cy="60" r="6" fill="rgba(200,164,240,.4)"/><circle cx="30" cy="30" r="3" fill="rgba(139,92,246,.3)"/><circle cx="90" cy="90" r="4" fill="rgba(236,72,153,.2)"/><circle cx="25" cy="85" r="2" fill="rgba(34,211,238,.3)"/></svg>';
    html+='<div class="empty-title font-serif">A gentle beginning</div>';
    html+='<div class="empty-text">Take a moment to notice how you feel. Tap a seed to plant your first flower.</div>';
    html+='</div></div>';
  }

  container.innerHTML=html;
}

// ===== CHECK-IN MODAL =====
function openCheckin(date,slotKey){
  editingDate=date; editingSlot=slotKey;
  const data=loadData();
  const existing=getEntry(data,date,slotKey);
  selectedMood=existing?existing.mood:null;
  selectedCore=existing?existing.core:null;
  selectedSpecific=existing?existing.specific:null;
  selectedNuanced=existing?existing.nuanced:null;
  emotionStep=0; currentModalPage=0;
  document.getElementById('modalPages').style.transform='translateX(0)';
  updatePageDots();
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('checkinModal').classList.add('open');
  if(existing){
    document.getElementById('activityInput').value=existing.activity||'';
    setTimeout(()=>goToModalPage(2),300);
  } else {
    document.getElementById('activityInput').value='';
  }
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('checkinModal').classList.remove('open');
  setTimeout(()=>{ currentModalPage=0; document.getElementById('modalPages').style.transform='translateX(0)'; updatePageDots(); },500);
}
function goToModalPage(n){
  currentModalPage=n;
  document.getElementById('modalPages').style.transform=`translateX(-${n*100}%)`;
  updatePageDots();
  if(n===1) renderEmotionPage();
}
function updatePageDots(){
  [0,1,2].forEach(i=>{
    document.getElementById('dot'+i).classList.toggle('active',i===currentModalPage);
  });
}

// Mood selection
function selectMood(m){
  selectedMood=m; selectedCore=null; selectedSpecific=null; selectedNuanced=null; emotionStep=0;
  // Bloom effect
  const overlay=document.getElementById('bloomOverlay');
  const flower=document.getElementById('bloomFlower');
  flower.textContent=MOOD_EMOJI[m];
  overlay.style.display='flex';
  flower.style.animation='none';
  flower.offsetHeight;
  flower.style.animation='bloomAnim 1.2s cubic-bezier(.22,1,.36,1) forwards';
  haptic('light');
  setTimeout(()=>{ overlay.style.display='none'; goToModalPage(1); },800);
}

// Emotion page
function renderEmotionPage(){
  const container=document.getElementById('emotionContainer');
  let html='<div class="emotion-container">';

  if(emotionStep===0){
    html+='<div class="emotion-step">';
    html+='<div class="emotion-step-title">How do you feel? (Step 1)</div>';
    html+='<div class="emotion-options">';
    Object.entries(WHEEL).forEach(([k,v])=>{
      html+='<button class="emotion-chip' + (selectedCore===k?' selected':'') + '" onclick="selectCore(' + "'" + k + "')" + '">' + v.icon + ' ' + v.label + '</button>';
    });
    html+='</div></div>';
  } else if(emotionStep===1){
    const core=WHEEL[selectedCore];
    html+='<div class="emotion-step">';
    html+='<button class="emotion-back" onclick="emotionStep=0;renderEmotionPage()">← Back</button>';
    html+='<div class="emotion-step-title">' + core.icon + ' ' + core.label + ' — What specifically?</div>';
    html+='<div class="emotion-options">';
    Object.entries(core.children).forEach(([k,v])=>{
      html+='<button class="emotion-chip' + (selectedSpecific===k?' selected':'') + '" onclick="selectSpecific(' + "'" + k + "')" + '">' + v.label + '</button>';
    });
    html+='</div></div>';
  } else if(emotionStep===2){
    const core=WHEEL[selectedCore];
    const spec=core.children[selectedSpecific];
    html+='<div class="emotion-step">';
    html+='<button class="emotion-back" onclick="emotionStep=1;renderEmotionPage()">← Back</button>';
    html+='<div class="emotion-step-title">' + spec.label + ' — Be more specific</div>';
    html+='<div class="emotion-options">';
    Object.entries(spec.children).forEach(([k,v])=>{
      html+='<button class="emotion-chip' + (selectedNuanced===k?' selected':'') + '" onclick="selectNuanced(' + "'" + k + "')" + '">' + v + '</button>';
    });
    html+='</div></div>';
  }

  html+='</div>';
  container.innerHTML=html;
}
function selectCore(k){ selectedCore=k; selectedSpecific=null; selectedNuanced=null; emotionStep=1; renderEmotionPage(); }
function selectSpecific(k){ selectedSpecific=k; selectedNuanced=null; emotionStep=2; renderEmotionPage(); }
function selectNuanced(k){ selectedNuanced=k; goToModalPage(2); }

// Save
function saveCheckin(){
  if(!selectedMood){ showToast('Please select a mood',{icon:'⚠️'}); haptic('error'); return; }
  if(!selectedCore){ showToast('Please select an emotion',{icon:'⚠️'}); haptic('error'); return; }
  const activity=document.getElementById('activityInput').value.trim();
  const entry={
    mood:selectedMood, core:selectedCore,
    specific:selectedSpecific||selectedCore,
    nuanced:selectedNuanced||selectedSpecific||selectedCore,
    activity:activity
  };
  const data=loadData();
  setEntry(data,editingDate,editingSlot,entry);
  saveData(data);
  haptic('light');
  showToast(MOOD_EMOJI[selectedMood]+' Planted',{icon:'🌱'});
  syncUp();
  closeModal();
  renderToday();
}

      '<div class="empty-title font-serif">Patience reveals patterns</div>' +

    return;
  }
  let html='<div class="section">';
  html+='<div class="review-garden">';
  dates.slice(-4).forEach(date=>{
    const dayEntries=data.entries[date];
    const allEntries=SLOTS.map(s=>dayEntries[s.key]).filter(Boolean);
    const avg=allEntries.length?(allEntries.reduce((a,e)=>a+MOOD_VALUES[e.mood],0)/allEntries.length).toFixed(1):'0';
    html+='<div class="review-week">';
    html+='<div class="review-week-bed">';
    html+='<div class="review-week-title font-serif">' + formatDateShort(date) + '</div>';
    html+='<div class="review-week-dates">' + allEntries.length + ' check-ins · Avg ' + avg + '</div>';
    html+='<div class="review-week-flowers">';
    SLOTS.forEach(s=>{
      const e=dayEntries[s.key];
      if(e){
        html+='<div style="display:flex;flex-direction:column;align-items:center;gap:4px">';
        html+='<span style="font-size:20px">' + MOOD_EMOJI[e.mood] + '</span>';
        html+='<span style="font-size:9px;color:var(--muted);text-transform:uppercase">' + s.label.slice(0,3) + '</span>';
        html+='</div>';
      }
    });
    html+='</div></div></div>';
  });
  html+='</div>';

  // Stats
  const allEntries=[];
  dates.slice(-7).forEach(d=>{ SLOTS.forEach(s=>{ const e=getEntry(data,d,s.key); if(e) allEntries.push(e); }); });
  const moodCounts={}; MOODS.forEach(m=>moodCounts[m]=0); allEntries.forEach(e=>moodCounts[e.mood]++);
  const emotionCounts={}; allEntries.forEach(e=>{ const l=e.nuanced||e.specific||e.core; emotionCounts[l]=(emotionCounts[l]||0)+1; });
  const topEmotions=Object.entries(emotionCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxEmo=topEmotions.length?topEmotions[0][1]:1;

  html+='<div class="chart-card"><div class="chart-header"><div class="chart-title">Top Emotions</div></div>';
  topEmotions.forEach(([label,count])=>{
    html+='<div class="freq-bar"><div class="freq-label">' + label + '</div><div class="freq-track"><div class="freq-fill" style="width:' + ((count/maxEmo)*100) + '%"></div></div><div class="freq-count">' + count + '</div></div>';
  });
  html+='</div>';

  html+='<div class="chart-card"><div class="chart-header"><div class="chart-title">Mood Garden</div></div><div class="dist-bars">';
  const distColors={great:'#6ee7b7',good:'#5eead4',fine:'#fdba74',bad:'#fb7185',awful:'#f43f5e'};
  const maxCount=Math.max(...Object.values(moodCounts),1);
  MOODS.slice().reverse().forEach(m=>{
    const count=moodCounts[m];
    const h=Math.max((count/maxCount)*64,6);
    html+='<div class="dist-bar"><div class="dist-count">' + count + '</div><div class="dist-pillar" style="height:' + h + 'px;background:' + distColors[m] + '"></div><div class="dist-label">' + MOOD_FACES[m] + '</div></div>';
  });
  html+='</div></div>';

  html+='<button class="share-btn" onclick="openReport()">🖼️ Generate Report</button>';
  html+='</div>';
  container.innerHTML=html;
}

function openReport(){
  const data=loadData();
  const dates=Object.keys(data.entries).sort().slice(-7);
  if(!dates.length){ showToast('No data to report',{icon:'⚠️'}); return; }
  const allEntries=[];
  dates.forEach(d=>{ SLOTS.forEach(s=>{ const e=getEntry(data,d,s.key); if(e) allEntries.push({...e,date:d,slot:s.key}); }); });
  const emotionCounts={}; allEntries.forEach(e=>{ const l=e.nuanced||e.specific||e.core; emotionCounts[l]=(emotionCounts[l]||0)+1; });
  const topEmotions=Object.entries(emotionCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const avgMood=allEntries.length?(allEntries.reduce((a,e)=>a+MOOD_VALUES[e.mood],0)/allEntries.length).toFixed(1):'--';

  let html='<button class="report-close" onclick="closeReport()">✕</button>';

  html+='<div class="report-header"><div class="report-app-name">moodie</div><div class="report-title font-serif">Weekly Mood Report</div><div class="report-dates">' + formatDateShort(dates[0]) + ' — ' + formatDateShort(dates[dates.length-1]) + '</div></div>';
  dates.forEach(d=>{
    const day=data.entries[d];
    html+='<div class="report-day"><div class="report-day-title">' + formatDate(d) + '</div>';
    SLOTS.forEach(s=>{
      const e=day?day[s.key]:null;
      if(e){
        html+='<div class="report-slot"><div class="report-slot-time">' + s.time.replace(':00','') + '</div><div class="report-slot-orb ' + e.mood + '">' + MOOD_FACES[e.mood] + '</div><div class="report-slot-info"><div class="report-slot-mood">' + e.mood + '</div><div class="report-slot-emotion">' + (e.nuanced||e.specific||e.core) + '</div>' + (e.activity?'<div class="report-slot-activity">' + escHtml(e.activity) + '</div>':'') + '</div></div>';
      }
    });
    html+='</div>';
  });
  html+='<div class="report-summary"><div class="report-summary-title">Summary</div>';
  html+='<div class="report-stat"><span class="report-stat-label">Entries</span><span class="report-stat-value">' + allEntries.length + '</span></div>';
  html+='<div class="report-stat"><span class="report-stat-label">Avg Mood</span><span class="report-stat-value">' + avgMood + '/5</span></div>';
  html+='<div class="report-stat"><span class="report-stat-label">Top Emotions</span><span class="report-stat-value">' + topEmotions.map(e=>e[0]).join(', ') + '</span></div>';
  html+='</div></div>';

  const div=document.createElement('div'); div.className='report-view'; div.id='reportView'; div.innerHTML=html;
  document.body.appendChild(div);
}

function downloadReport(){ showToast('Report feature coming soon',{icon:'🖼️'}); }
function shareReportText(){
  const data=loadData(); const dates=Object.keys(data.entries).sort().slice(-7);

// ===== DATA ACTIONS =====
function exportData(){
  const data=loadData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='moodie-data-'+todayKey()+'.json'; a.click();
  URL.revokeObjectURL(url); showToast('Data exported',{icon:'📤'});
}
function importData(){ document.getElementById('importFileInput').click(); }
function handleImport(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.entries) throw new Error('Invalid');
      const existing=loadData();
      Object.entries(imported.entries).forEach(([date,slots])=>{
        if(!existing.entries[date]) existing.entries[date]={};
        Object.entries(slots).forEach(([slot,entry])=>{ existing.entries[date][slot]=entry; });
      });
      saveData(existing); showToast('Data imported',{icon:'📥'}); renderToday();
    }catch(err){ showToast('Invalid file',{icon:'⚠️'}); }
  };
  reader.readAsText(file); event.target.value='';
}
function confirmReset(){
  confirmCallback=()=>{ localStorage.removeItem('moodie_data'); localStorage.removeItem('moodie_sync'); showToast('All data cleared',{icon:'🗑'}); renderToday(); };
  document.getElementById('confirmTitle').textContent='Clear All Data?';
  document.getElementById('confirmText').textContent='This permanently deletes all entries. Cannot be undone.';
  document.getElementById('confirmBtn').textContent='Delete';
  document.getElementById('confirmBackdrop').classList.add('open');
}
function cancelConfirm(){ document.getElementById('confirmBackdrop').classList.remove('open'); confirmCallback=null; }
function confirmAction(){ if(confirmCallback) confirmCallback(); cancelConfirm(); }

function toggleReminders(){
  if(!('Notification' in window)){ showToast('Not supported',{icon:'⚠️'}); return; }
  if(Notification.permission==='granted'){ showToast('Already enabled',{icon:'🔔'}); }
  else {
    Notification.requestPermission().then(p=>{
      if(p==='granted'){ showToast('Reminders enabled',{icon:'🔔'}); scheduleReminders(); }
      else { showToast('Permission denied',{icon:'⚠️'}); }
    });
  }
}
function scheduleReminders(){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date(); const times=[9,14,18,21];
  times.forEach(h=>{
    const target=new Date(now); target.setHours(h,0,0,0);
    if(target<=now) target.setDate(target.getDate()+1);
    setTimeout(()=>{
      new Notification('moodie',{body:'Time for your check-in',icon:'icons/icon-192.png',tag:'moodie-'+h});
      scheduleReminders();
    },target-now);
  });
}
function saveSyncSettings(){
  const token=document.getElementById('ghToken').value.trim();
  const gistId=document.getElementById('ghGistId').value.trim();
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}');
  if(token) sync.token=token; if(gistId) sync.gist_id=gistId;
  localStorage.setItem('moodie_sync',JSON.stringify(sync));
  syncUp(); showToast('Sync saved',{icon:'☁️'});
}
function syncUp(){
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}'); if(!sync.token) return;
  const data=loadData();
  const body={description:'moodie',public:false,files:{'moodie-data.json':{content:JSON.stringify(data,null,2)}}};
  const opts={method:'POST',headers:{Authorization:'token '+sync.token,Accept:'application/vnd.github.v3+json'},body:JSON.stringify(body)};
  const url=sync.gist_id?'https://api.github.com/gists/'+sync.gist_id:'https://api.github.com/gists';
  if(sync.gist_id) opts.method='PATCH';
  fetch(url,opts).then(r=>r.json()).then(gist=>{
    if(gist.id&&!sync.gist_id){ sync.gist_id=gist.id; localStorage.setItem('moodie_sync',JSON.stringify(sync)); }
  }).catch(()=>{});
}
function loadSyncSettings(){
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}');
  if(sync.token) document.getElementById('ghToken').value=sync.token;
  if(sync.gist_id) document.getElementById('ghGistId').value=sync.gist_id;
}

// ===== INIT =====
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
initTheme();
renderToday();
if('Notification' in window && Notification.permission==='granted') scheduleReminders();
</script>
</body>
