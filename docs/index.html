<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="moodie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>moodie — Mood Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg-deep:#070510;--bg-mid:#0d0b1a;--bg-warm:#15122a;
--surface:rgba(255,255,255,.04);
--glass:rgba(255,255,255,.06);
--glass-border:rgba(255,255,255,.1);
--fg:#ede9fe;--fg-soft:#a5a1c0;--muted:#6b6880;--subtle:rgba(255,255,255,.12);
--accent:#d8b4fe;--accent-soft:rgba(216,180,254,.15);--accent-warm:rgba(216,180,254,.08);
--great:#6ee7b7;--great-soft:rgba(110,231,183,.15);
--good:#5eead4;--good-soft:rgba(94,234,212,.15);
--fine:#fdba74;--fine-soft:rgba(253,186,116,.15);
--bad:#fb7185;--bad-soft:rgba(251,113,133,.15);
--awful:#f43f5e;--awful-soft:rgba(244,63,94,.15);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--fg);background:var(--bg-deep)}
body{position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 120% 80% at 20% 40%,rgba(139,92,246,.12),transparent 60%),radial-gradient(ellipse 100% 60% at 80% 80%,rgba(236,72,153,.08),transparent 50%),radial-gradient(ellipse 80% 50% at 50% 0%,rgba(34,211,238,.06),transparent 50%);pointer-events:none;z-index:0;animation:aurora 20s ease-in-out infinite}
@keyframes aurora{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.05) translateX(-2%)}}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;z-index:1}

/* Floating orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.4}
.orb-1{width:300px;height:300px;background:rgba(139,92,246,.15);top:10%;left:-10%;animation:orbFloat1 25s ease-in-out infinite}
.orb-2{width:250px;height:250px;background:rgba(236,72,153,.1);top:60%;right:-5%;animation:orbFloat2 30s ease-in-out infinite}
.orb-3{width:200px;height:200px;background:rgba(34,211,238,.08);bottom:10%;left:20%;animation:orbFloat3 35s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,15px) scale(.95)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-25px,30px) scale(1.05)}66%{transform:translate(15px,-25px) scale(1.1)}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,25px) scale(1.15)}66%{transform:translate(-30px,-15px) scale(.9)}}

/* Header */
.header{flex-shrink:0;padding:24px 24px 16px;position:relative;z-index:10}
.header-top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 20px rgba(139,92,246,.3);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 4px 20px rgba(139,92,246,.3)}50%{box-shadow:0 4px 30px rgba(139,92,246,.5)}}
.logo-text{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--fg)}
.settings-btn-header{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);color:var(--muted);backdrop-filter:blur(20px)}
.settings-btn-header:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);transform:rotate(90deg) scale(1.1)}
.subtitle{color:var(--muted);font-size:14px;margin-top:6px;font-weight:400;letter-spacing:.3px}

/* Main */
.main{flex:1;position:relative;overflow:hidden}
.panels{height:100%;display:flex;transition:transform .6s cubic-bezier(.22,1,.36,1);touch-action:pan-y}
.panel{min-width:100%;height:100%;padding:0 24px 24px;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.panel::-webkit-scrollbar{width:0}
.panel-content{padding-top:8px;padding-bottom:100px}
.section{margin-bottom:28px;opacity:0;transform:translateY(24px);animation:reveal .7s cubic-bezier(.22,1,.36,1) forwards}
.section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding:0 4px}

/* Hero mood card */
.hero-mood{background:var(--surface);border:1px solid var(--glass-border);border-radius:28px;padding:28px 24px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(20px);animation:reveal .8s cubic-bezier(.22,1,.36,1) forwards}
.hero-mood::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.03),transparent 70%);pointer-events:none}
.hero-emoji{font-size:64px;margin-bottom:12px;display:inline-block;animation:emojiFloat 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(255,255,255,.1))}
@keyframes emojiFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.hero-mood-label{font-size:28px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.hero-mood-desc{font-size:15px;color:var(--muted);font-weight:400}
.hero-mood-meta{display:flex;justify-content:center;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--glass-border)}
.hero-meta-item{text-align:center}
.hero-meta-val{font-size:13px;font-weight:600;color:var(--fg-soft)}
.hero-meta-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* Progress ring */
.today-progress{display:flex;align-items:center;gap:18px;margin-bottom:20px;padding:22px 20px;background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.today-progress::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.progress-ring{position:relative;width:60px;height:60px;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.progress-bg{fill:none;stroke:var(--glass);stroke-width:5}
.progress-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent)}
.progress-info{flex:1}
.progress-title{font-size:17px;font-weight:600;margin-bottom:3px}
.progress-desc{font-size:14px;color:var(--muted)}

/* Slot Cards */
.slot-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;padding:22px 20px;margin-bottom:12px;cursor:pointer;transition:all .5s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;backdrop-filter:blur(20px)}
.slot-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.slot-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.slot-card:active{transform:scale(.97)}
.slot-card.morning{border-left:3px solid var(--fine-soft)}
.slot-card.afternoon{border-left:3px solid var(--good-soft)}
.slot-card.evening{border-left:3px solid var(--accent-warm)}
.slot-card.night{border-left:3px solid var(--great-soft)}
.slot-card.filled.morning{border-left:3px solid var(--fine)}
.slot-card.filled.afternoon{border-left:3px solid var(--good)}
.slot-card.filled.evening{border-left:3px solid var(--accent)}
.slot-card.filled.night{border-left:3px solid var(--great)}
.slot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.slot-time-group{display:flex;align-items:center;gap:10px}
.slot-period{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.slot-time{font-size:11px;font-weight:500;color:var(--subtle);background:var(--glass);padding:4px 12px;border-radius:20px}
.slot-status{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px}
.slot-status.done{background:var(--great-soft);color:var(--great)}
.slot-status.missed{background:var(--bad-soft);color:var(--bad)}
.slot-empty{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.slot-empty-text{color:var(--muted);font-size:15px;font-weight:400}
.slot-empty-icon{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .4s cubic-bezier(.22,1,.36,1)}
.slot-card:hover .slot-empty-icon{background:var(--accent-soft);border-color:rgba(216,180,254,.3);transform:scale(1.15) rotate(10deg)}
.slot-mood{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mood-orb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;position:relative;transition:all .4s cubic-bezier(.22,1,.36,1)}
.mood-orb::after{content:'';position:absolute;inset:-6px;border-radius:50%;opacity:.3;animation:orbPulse 2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.4;transform:scale(1.05)}}
.mood-orb.great{background:var(--great-soft);box-shadow:0 0 24px var(--great-soft)}
.mood-orb.great::after{box-shadow:inset 0 0 10px var(--great)}
.mood-orb.good{background:var(--good-soft);box-shadow:0 0 24px var(--good-soft)}
.mood-orb.good::after{box-shadow:inset 0 0 10px var(--good)}
.mood-orb.fine{background:var(--fine-soft);box-shadow:0 0 24px var(--fine-soft)}
.mood-orb.fine::after{box-shadow:inset 0 0 10px var(--fine)}
.mood-orb.bad{background:var(--bad-soft);box-shadow:0 0 24px var(--bad-soft)}
.mood-orb.bad::after{box-shadow:inset 0 0 10px var(--bad)}
.mood-orb.awful{background:var(--awful-soft);box-shadow:0 0 24px var(--awful-soft)}
.mood-orb.awful::after{box-shadow:inset 0 0 10px var(--awful)}
.slot-mood-text{flex:1}
.slot-mood-label{font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:.3px}
.slot-mood-label.great{color:var(--great)}
.slot-mood-label.good{color:var(--good)}
.slot-mood-label.fine{color:var(--fine)}
.slot-mood-label.bad{color:var(--bad)}
.slot-mood-label.awful{color:var(--awful)}
.slot-emotion{font-size:15px;color:var(--fg-soft);font-weight:400;line-height:1.4}
.slot-emotion span{color:var(--fg);font-weight:500}
.slot-activity{font-size:14px;color:var(--muted);margin-top:6px;padding-left:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* Breathing empty slot */
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}

/* Bottom Nav */
.bottom-nav{flex-shrink:0;display:flex;justify-content:space-around;padding:12px 24px 32px;background:linear-gradient(0deg,var(--bg-mid) 0%,transparent 100%);position:relative;z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);border-radius:20px;background:transparent;border:none;color:inherit;font:inherit;position:relative}
.nav-item:hover{background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{color:var(--accent);transform:translateY(-2px)}
.nav-icon{font-size:20px;color:var(--muted);transition:all .4s cubic-bezier(.22,1,.36,1)}
.nav-label{font-size:10px;font-weight:600;color:var(--muted);transition:color .4s;letter-spacing:.5px}
.nav-item.active .nav-label{color:var(--accent)}
.nav-glow{position:absolute;top:4px;width:24px;height:3px;background:var(--accent);border-radius:2px;opacity:0;transition:opacity .4s;box-shadow:0 0 12px var(--accent)}
.nav-item.active .nav-glow{opacity:1}

/* Bottom Sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(7,5,16,.7);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:100}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg-mid);border-top:1px solid var(--glass-border);border-radius:32px 32px 0 0;padding:28px 28px 36px;transform:translateY(100%);transition:transform .6s cubic-bezier(.22,1,.36,1);z-index:101;max-width:480px;margin:0 auto;max-height:85vh;overflow-y:auto;box-shadow:0 -24px 80px rgba(0,0,0,.5)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:44px;height:5px;border-radius:3px;background:var(--subtle);margin:0 auto 24px;opacity:.4}
.sheet-title{font-size:22px;font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--fg)}
.sheet-close{width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;margin-left:auto;color:var(--muted);transition:all .3s}
.sheet-close:hover{background:var(--accent-soft);color:var(--accent);transform:rotate(90deg)}
.sheet-section{margin-bottom:28px}
.sheet-section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}

/* Mood Selector */
.mood-selector{display:flex;gap:10px;justify-content:space-between}
.mood-btn{flex:1;padding:18px 4px;border-radius:20px;border:2px solid var(--glass-border);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);font-family:inherit;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.mood-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.05),transparent 70%);opacity:0;transition:opacity .4s}
.mood-btn:hover::before{opacity:1}
.mood-btn:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18)}
.mood-btn:active{transform:scale(.95)}
.mood-btn .mood-face{font-size:32px;transition:transform .4s cubic-bezier(.22,1,.36,1);display:block}
.mood-btn:hover .mood-face{transform:scale(1.2) rotate(-5deg)}
.mood-btn .mood-label{font-size:11px;font-weight:600;text-transform:capitalize;letter-spacing:.5px;color:var(--muted)}
.mood-btn.selected{transform:translateY(-4px)}
.mood-btn.great.selected{border-color:var(--great);background:var(--great-soft);box-shadow:0 12px 32px var(--great-soft)}
.mood-btn.great.selected .mood-label{color:var(--great)}
.mood-btn.good.selected{border-color:var(--good);background:var(--good-soft);box-shadow:0 12px 32px var(--good-soft)}
.mood-btn.good.selected .mood-label{color:var(--good)}
.mood-btn.fine.selected{border-color:var(--fine);background:var(--fine-soft);box-shadow:0 12px 32px var(--fine-soft)}
.mood-btn.fine.selected .mood-label{color:var(--fine)}
.mood-btn.bad.selected{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 12px 32px var(--bad-soft)}
.mood-btn.bad.selected .mood-label{color:var(--bad)}
.mood-btn.awful.selected{border-color:var(--awful);background:var(--awful-soft);box-shadow:0 12px 32px var(--awful-soft)}
.mood-btn.awful.selected .mood-label{color:var(--awful)}

/* Emotion Picker */
.emotion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emotion-btn{padding:18px 8px;border-radius:18px;border:1px solid var(--glass-border);background:var(--surface);text-align:center;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);font-family:inherit;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.emotion-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.05),transparent 70%);opacity:0;transition:opacity .4s}
.emotion-btn:hover::before{opacity:1}
.emotion-btn:hover{border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
.emotion-btn:active{transform:scale(.96)}
.emotion-btn.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 20px var(--accent-soft)}
.emotion-btn .emo-icon{font-size:26px;display:block;margin-bottom:8px;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.emotion-btn:hover .emo-icon{transform:scale(1.15)}
.emotion-btn .emo-label{font-size:11px;font-weight:600;color:var(--fg-soft);text-transform:capitalize;letter-spacing:.3px}
.emotion-btn.selected .emo-label{color:var(--accent)}
.emotion-back{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;border:1px solid var(--glass-border);background:var(--surface);color:var(--fg-soft);font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;margin-bottom:14px;font-family:inherit;backdrop-filter:blur(10px)}
.emotion-back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.emotion-path{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.emotion-path-item{padding:6px 14px;border-radius:12px;font-size:12px;font-weight:600;text-transform:capitalize;letter-spacing:.3px;background:var(--accent-soft);color:var(--accent)}
.emotion-path-arrow{color:var(--subtle);font-size:13px}

/* Inputs */
.sheet-input{width:100%;padding:18px 20px;font-size:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:18px;color:var(--fg);font-family:inherit;transition:all .4s;backdrop-filter:blur(10px)}
.sheet-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sheet-input::placeholder{color:var(--subtle)}
.sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:24px}
.sheet-btn{padding:18px;border-radius:18px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1)}
.sheet-btn:active{transform:scale(.97)}
.sheet-btn.cancel{background:var(--surface);color:var(--fg-soft);border:1px solid var(--glass-border)}
.sheet-btn.cancel:hover{background:var(--glass)}
.sheet-btn.save{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:var(--bg-deep);font-weight:700;box-shadow:0 4px 20px rgba(216,180,254,.2)}
.sheet-btn.save:hover{box-shadow:0 8px 32px rgba(216,180,254,.35);transform:translateY(-2px)}

/* History */
.history-day-group{margin-bottom:28px}
.history-day-header{font-size:16px;font-weight:600;margin-bottom:14px;padding:0 4px;color:var(--fg);letter-spacing:.3px}
.history-day-header span{color:var(--muted);font-weight:400;font-size:14px;margin-left:10px}
.history-entry{background:var(--surface);border:1px solid var(--glass-border);border-radius:22px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(20px);position:relative;overflow:hidden}
.history-entry::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.history-entry:hover{border-color:rgba(255,255,255,.12);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.2)}
.history-entry:active{transform:scale(.99)}
.history-time{flex-shrink:0;font-size:13px;font-weight:600;color:var(--muted);width:48px}
.history-mood-orb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.history-entry:hover .history-mood-orb{transform:scale(1.1) rotate(-5deg)}
.history-mood-orb.great{background:var(--great-soft);box-shadow:0 0 16px var(--great-soft)}
.history-mood-orb.good{background:var(--good-soft);box-shadow:0 0 16px var(--good-soft)}
.history-mood-orb.fine{background:var(--fine-soft);box-shadow:0 0 16px var(--fine-soft)}
.history-mood-orb.bad{background:var(--bad-soft);box-shadow:0 0 16px var(--bad-soft)}
.history-mood-orb.awful{background:var(--awful-soft);box-shadow:0 0 16px var(--awful-soft)}
.history-info{flex:1;overflow:hidden}
.history-emotion{font-size:15px;font-weight:500;color:var(--fg);margin-bottom:3px}
.history-activity{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Charts */
.chart-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;padding:22px 20px;margin-bottom:20px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.chart-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.chart-value{font-size:16px;font-weight:600;color:var(--accent)}
.sparkline{width:100%;height:90px}
.freq-bar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.freq-label{font-size:14px;font-weight:500;width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-soft)}
.freq-track{flex:1;height:6px;background:var(--glass);border-radius:3px;overflow:hidden}
.freq-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#ec4899);transition:width .8s cubic-bezier(.22,1,.36,1)}
.freq-count{font-size:13px;font-weight:600;color:var(--muted);width:24px;text-align:right}

/* Mood Distribution */
.dist-bars{display:flex;gap:10px;align-items:flex-end;height:80px;padding-top:12px}
.dist-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.dist-count{font-size:12px;font-weight:600;color:var(--fg-soft)}
.dist-pillar{width:100%;border-radius:10px;transition:height .8s cubic-bezier(.22,1,.36,1);min-height:4px;position:relative;overflow:hidden}
.dist-pillar::after{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);border-radius:10px 10px 0 0}
.dist-label{font-size:11px;color:var(--muted)}

/* Share */
.share-btn{width:100%;padding:18px;border-radius:18px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:var(--bg-deep);margin-top:24px;box-shadow:0 4px 20px rgba(216,180,254,.2)}
.share-btn:hover{box-shadow:0 8px 32px rgba(216,180,254,.35);transform:translateY(-2px)}
.share-btn:active{transform:scale(.97)}

/* Settings */
.settings-group{background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;overflow:hidden;margin-bottom:16px;backdrop-filter:blur(20px);position:relative}
.settings-group::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.settings-group-title{padding:18px 20px 10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.settings-row{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--glass-border);cursor:pointer;transition:all .3s}
.settings-row:last-child{border-bottom:none}
.settings-row:hover{background:rgba(255,255,255,.03)}
.settings-row-info{flex:1}
.settings-row-label{font-size:16px;font-weight:500;margin-bottom:3px;color:var(--fg)}
.settings-row-desc{font-size:14px;color:var(--muted)}
.settings-row-action{font-size:20px;color:var(--subtle);flex-shrink:0;transition:all .3s cubic-bezier(.22,1,.36,1)}
.settings-row:hover .settings-row-action{color:var(--accent);transform:translateX(4px)}
.settings-btn-row{padding:16px 20px}
.settings-btn{width:100%;padding:18px;border-radius:16px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;gap:10px}
.settings-btn:active{transform:scale(.97)}
.settings-btn.primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:var(--bg-deep);font-weight:700;box-shadow:0 4px 20px rgba(216,180,254,.2)}
.settings-btn.primary:hover{box-shadow:0 8px 32px rgba(216,180,254,.35);transform:translateY(-2px)}
.settings-btn.secondary{background:var(--surface);color:var(--fg-soft);border:1px solid var(--glass-border)}
.settings-btn.secondary:hover{border-color:rgba(255,255,255,.15)}
.settings-btn.danger{background:var(--awful-soft);color:var(--awful);border:1px solid rgba(244,63,94,.2)}
.settings-btn.danger:hover{box-shadow:0 4px 20px var(--awful-soft)}
.settings-input-row{padding:16px 20px;border-bottom:1px solid var(--glass-border)}
.settings-input-row:last-child{border-bottom:none}
.settings-input-row label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.settings-input-row input{width:100%;padding:16px 18px;font-size:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;color:var(--fg);font-family:inherit;transition:all .4s}
.settings-input-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Toast */
.toast-container{position:fixed;bottom:120px;left:24px;right:24px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.toast{background:var(--surface);color:var(--fg);padding:16px 24px;border-radius:18px;font-size:15px;font-weight:500;opacity:0;transform:translateY(24px) scale(.95);transition:all .6s cubic-bezier(.22,1,.36,1);pointer-events:auto;box-shadow:0 16px 48px rgba(0,0,0,.3);border:1px solid var(--glass-border);display:flex;align-items:center;gap:12px;max-width:100%;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateY(0) scale(1)}

/* Confirm */
.confirm-backdrop{position:fixed;inset:0;background:rgba(7,5,16,.6);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s;z-index:150;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-backdrop.open{opacity:1;pointer-events:auto}
.confirm-dialog{background:var(--bg-mid);border:1px solid var(--glass-border);border-radius:28px;padding:32px;max-width:340px;width:100%;text-align:center;transform:scale(.9);transition:transform .5s cubic-bezier(.22,1,.36,1);box-shadow:0 24px 64px rgba(0,0,0,.4)}
.confirm-backdrop.open .confirm-dialog{transform:scale(1)}
.confirm-icon{font-size:56px;margin-bottom:20px}
.confirm-title{font-size:20px;font-weight:600;margin-bottom:10px}
.confirm-text{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.confirm-actions{display:flex;gap:12px}
.confirm-btn{flex:1;padding:16px;border-radius:16px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1)}
.confirm-btn:active{transform:scale(.97)}
.confirm-btn.cancel{background:var(--surface);color:var(--fg-soft);border:1px solid var(--glass-border)}
.confirm-btn.danger{background:var(--awful-soft);color:var(--awful);border:1px solid rgba(244,63,94,.2)}

/* Report */
.report-view{position:fixed;inset:0;background:var(--bg-deep);z-index:300;overflow-y:auto}
.report-content{max-width:480px;margin:0 auto;padding:32px 28px 56px}
.report-header{text-align:center;margin-bottom:32px}
.report-app-name{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:4px;margin-bottom:8px}
.report-title{font-size:28px;font-weight:700}
.report-dates{font-size:15px;color:var(--muted);margin-top:8px}
.report-day{background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;padding:20px;margin-bottom:16px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.report-day::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.report-day-title{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between}
.report-day-title span{color:var(--muted);font-weight:400;font-size:14px}
.report-slot{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:15px}
.report-slot-time{width:60px;font-weight:600;color:var(--muted);font-size:13px}
.report-slot-orb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.report-slot-orb.great{background:var(--great-soft)}
.report-slot-orb.good{background:var(--good-soft)}
.report-slot-orb.fine{background:var(--fine-soft)}
.report-slot-orb.bad{background:var(--bad-soft)}
.report-slot-orb.awful{background:var(--awful-soft)}
.report-slot-info{flex:1;overflow:hidden}
.report-slot-mood{font-weight:600;text-transform:capitalize}
.report-slot-emotion{color:var(--muted);font-size:14px}
.report-slot-activity{color:var(--subtle);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report-summary{background:var(--surface);border:1px solid var(--glass-border);border-radius:24px;padding:20px;margin-top:20px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.report-summary::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.report-summary-title{font-size:12px;font-weight:600;margin-bottom:14px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.report-stat{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.report-stat-label{color:var(--muted)}
.report-stat-value{font-weight:600}
.report-actions{display:flex;gap:12px;margin-top:28px}
.report-actions .share-btn{flex:1}
.report-close{position:fixed;top:24px;right:24px;z-index:301;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--fg);transition:all .4s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(20px)}
.report-close:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);transform:rotate(90deg) scale(1.1)}

/* Empty States with SVG */
.empty-state{text-align:center;padding:64px 32px}
.empty-illustration{width:120px;height:120px;margin:0 auto 28px;opacity:.8}
.empty-title{font-size:24px;font-weight:600;margin-bottom:12px;letter-spacing:.3px}
.empty-text{font-size:16px;color:var(--muted);line-height:1.6;max-width:300px;margin:0 auto;font-weight:400}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reveal{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes breathe{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 4px 20px rgba(139,92,246,.3)}50%{box-shadow:0 4px 40px rgba(139,92,246,.5)}}

/* Accessibility */
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
button:focus-visible{border-radius:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function renderReviewChart(data,dates){
  const pts=[];
  dates.forEach(d=>{ SLOTS.forEach(s=>{ const e=getEntry(data,d,s.key); if(e) pts.push(MOOD_VALUES[e.mood]); }); });
  if(pts.length<2) return;
  const w=320,h=80,p=8;
  const minV=1,maxV=5,range=maxV-minV;
  const coords=pts.map((v,i)=>{
    const x=p+(i/(pts.length-1))*(w-p*2);
    const y=h-p-((v-minV)/range)*(h-p*2);
    return [x,y];
  });
  const d=coords.map((c,i)=>(i===0?'M':'L')+c[0]+','+c[1]).join(' ');
  const area=d+' L'+coords[coords.length-1][0]+','+(h-p)+' L'+coords[0][0]+','+(h-p)+' Z';
  document.getElementById('reviewLine').setAttribute('d',d);
  document.getElementById('reviewArea').setAttribute('d',area);
}

function downloadReport(){
  const el=document.getElementById('reportCapture');
  if(!el) return;
  const canvas=document.createElement('canvas');
  const scale=2;
  const W=480;
  canvas.width=W*scale;
  const temp=document.createElement('div');
  temp.style.cssText=`position:fixed;left:-9999px;top:0;width:${W}px;background:#0a0a0c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;font-size:14px;line-height:1.5`;
  temp.innerHTML=el.innerHTML;
  document.body.appendChild(temp);
  const H=temp.scrollHeight+48;
  canvas.height=H*scale;
  const ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle='#0a0a0c';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f5f5f7';
  ctx.textAlign='center';
  ctx.font='bold 12px -apple-system,sans-serif';
  ctx.fillStyle='#a78bfa';
  ctx.fillText('MOODIE',W/2,30);
  ctx.font='bold 22px -apple-system,sans-serif';
  ctx.fillStyle='#f5f5f7';
  ctx.fillText('Weekly Mood Report',W/2,56);
  const subtitle=document.querySelector('.report-dates');
  if(subtitle){
    ctx.font='13px -apple-system,sans-serif';
    ctx.fillStyle='#6e6e7a';
    ctx.fillText(subtitle.textContent,W/2,76);
  }
  ctx.textAlign='left';
  let y=100;
  const data=loadData();
  const dates=Object.keys(data.entries).sort().slice(-7);
  dates.forEach(d=>{
    ctx.fillStyle='#141418';
    roundRect(ctx,16,y,W-32,8,12);
    ctx.fill();
    ctx.strokeStyle='#2a2a32';
    ctx.lineWidth=1;
    roundRect(ctx,16,y,W-32,8,12);
    ctx.stroke();
    ctx.font='bold 14px -apple-system,sans-serif';
    ctx.fillStyle='#f5f5f7';
    ctx.fillText(formatDate(d),28,y+20);
    const day=data.entries[d];
    let dy=36;
    SLOTS.forEach(s=>{
      const e=day?day[s.key]:null;
      if(e){
        const slot=SLOTS.find(sl=>sl.key===s.key);
        const colors={great:'#4ade80',good:'#2dd4bf',fine:'#fbbf24',bad:'#f97316',awful:'#ef4444'};
        ctx.beginPath();
        ctx.arc(42,y+dy,4,0,Math.PI*2);
        ctx.fillStyle=colors[e.mood]||'#6e6e7a';
        ctx.fill();
        ctx.font='bold 12px -apple-system,sans-serif';
        ctx.fillStyle='#6e6e7a';
        ctx.fillText(slot.time.replace(':00',''),54,y+dy+4);
        ctx.fillStyle='#f5f5f7';
        ctx.fillText(`${e.mood} · ${e.nuanced||e.specific||e.core}`,110,y+dy+4);
        if(e.activity){
          ctx.font='11px -apple-system,sans-serif';
          ctx.fillStyle='#3a3a44';
          ctx.fillText(e.activity.substring(0,40),110,y+dy+18);
          dy+=16;
        }
        dy+=24;
      }
    });
    y+=Math.max(dy+12,56);
  });
  document.body.removeChild(temp);
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`moodie-report-${todayKey()}.png`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Report downloaded!',{icon:'📥'});
  },'image/png');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function handleImport(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.entries) throw new Error('Invalid format');
      const existing=loadData();
      Object.entries(imported.entries).forEach(([date,slots])=>{
        if(!existing.entries[date]) existing.entries[date]={};
        Object.entries(slots).forEach(([slot,entry])=>{
          existing.entries[date][slot]=entry;
        });
      });
      saveData(existing);
      showToast('Data imported successfully',{icon:'📥'});
      renderToday();
    }catch(err){
      showToast('Invalid file format',{icon:'⚠️'});
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function scheduleReminders(){

  const now=new Date();
  const times=[9,14,18,21];
  times.forEach(h=>{
    const target=new Date(now);
    target.setHours(h,0,0,0);
    if(target<=now) target.setDate(target.getDate()+1);
    const delay=target-now;
    setTimeout(()=>{
      new Notification('moodie',{body:`Time for your ${h===9?'Morning':h===14?'Afternoon':h===18?'Evening':'Night'} check-in`,icon:'icons/icon-192.png',tag:'moodie-'+h});
      scheduleReminders();
    },delay);
  });
}
function saveSyncSettings(){
  const token=document.getElementById('ghToken').value.trim();
  const gistId=document.getElementById('ghGistId').value.trim();
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}');
  if(token) sync.token=token;
  if(gistId) sync.gist_id=gistId;
  localStorage.setItem('moodie_sync',JSON.stringify(sync));
  syncUp();
  showToast('Sync settings saved',{icon:'☁️'});
}
function syncUp(){
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}');
  if(!sync.token) return;
  const data=loadData();
  const body={description:'moodie mood tracker data',public:false,
    files:{'moodie-data.json':{content:JSON.stringify(data,null,2)}}};
  const opts={method:'POST',headers:{Authorization:`token ${sync.token}`,Accept:'application/vnd.github.v3+json'},body:JSON.stringify(body)};
  const url=sync.gist_id?`https://api.github.com/gists/${sync.gist_id}`:'https://api.github.com/gists';
  if(sync.gist_id){ opts.method='PATCH'; }
  fetch(url,opts).then(r=>r.json()).then(gist=>{
    if(gist.id&&!sync.gist_id){
      sync.gist_id=gist.id;
      localStorage.setItem('moodie_sync',JSON.stringify(sync));
    }
  }).catch(()=>{});
}
function loadSyncSettings(){
  const sync=JSON.parse(localStorage.getItem('moodie_sync')||'{}');
  if(sync.token) document.getElementById('ghToken').value=sync.token;
  if(sync.gist_id) document.getElementById('ghGistId').value=sync.gist_id;
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
renderToday();
loadSyncSettings();
if('Notification' in window && Notification.permission==='granted') scheduleReminders();
function formatDateShort(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openCheckin(date,slotKey){
  editingDate=date;
  editingSlot=slotKey;
  const data=loadData();
  const existing=getEntry(data,date,slotKey);
  selectedMood=existing?existing.mood:null;
  selectedCore=existing?existing.core:null;
  selectedSpecific=existing?existing.specific:null;
  selectedNuanced=existing?existing.nuanced:null;
  emotionStep=0;
  const slot=SLOTS.find(s=>s.key===slotKey);
  document.getElementById('sheetTitle').textContent=`${slot.label} · ${slot.time}`;
  renderCheckinSheet();
  document.getElementById('inputSheet').classList.add('open');
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  document.getElementById('inputSheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}
function renderCheckinSheet(){
  const body=document.getElementById('sheetBody');
  let html='<div class="sheet-section"><div class="sheet-section-title">Mood</div><div class="mood-selector">';
  MOODS.forEach(m=>{
    html+=`<button class="mood-btn ${m}${selectedMood===m?' selected':''}" onclick="selectMood('${m}')">
      <span class="mood-face">${MOOD_FACES[m]}</span><span class="mood-label">${m}</span></button>`;
  });
  html+='</div></div>';
  html+=renderEmotionPicker();
  html+=`<div class="sheet-section"><div class="sheet-section-title">What were you doing?</div>
    <input class="sheet-input" id="activityInput" type="text" placeholder="e.g., Having morning coffee, Working, Scrolling social media..." value="${escHtml(getExistingActivity())}">
  </div>`;
  html+=`<div class="sheet-actions">
    <button class="sheet-btn cancel" onclick="closeSheet()">Cancel</button>
    <button class="sheet-btn save" onclick="saveCheckin()">Save</button>
  </div>`;
  body.innerHTML=html;
}
function getExistingActivity(){
  if(!editingDate||!editingSlot) return '';
  const data=loadData();
  const e=getEntry(data,editingDate,editingSlot);
  return e?e.activity||'':'';
}
function selectMood(m){ selectedMood=m; renderCheckinSheet(); }
function renderEmotionPicker(){
  if(emotionStep===0){
    let html='<div class="sheet-section"><div class="sheet-section-title">How do you feel? (Step 1/3)</div><div class="emotion-grid">';
    Object.entries(WHEEL).forEach(([k,v])=>{
      html+=`<button class="emotion-btn${selectedCore===k?' selected':''}" onclick="selectCore('${k}')">
        <span class="emo-icon">${v.icon}</span><span class="emo-label">${v.label}</span></button>`;
    });
    html+='</div></div>';
    return html;
  }
  if(emotionStep===1){
    const core=WHEEL[selectedCore];
    let html=`<div class="sheet-section">
      <div class="emotion-back" onclick="emotionStep=0;renderCheckinSheet()">← Back</div>
      <div class="emotion-path">
        <span class="emotion-path-item">${core.icon} ${core.label}</span>
      </div>
      <div class="sheet-section-title">What specifically? (Step 2/3)</div>
      <div class="emotion-grid">`;
    Object.entries(core.children).forEach(([k,v])=>{
      html+=`<button class="emotion-btn${selectedSpecific===k?' selected':''}" onclick="selectSpecific('${k}')">
        <span class="emo-label">${v.label}</span></button>`;
    });
    html+='</div></div>';
    return html;
  }
  if(emotionStep===2){
    const core=WHEEL[selectedCore];
    const spec=core.children[selectedSpecific];
    let html=`<div class="sheet-section">
      <div class="emotion-back" onclick="emotionStep=1;renderCheckinSheet()">← Back</div>
      <div class="emotion-path">
        <span class="emotion-path-item">${core.icon} ${core.label}</span>
        <span class="emotion-path-arrow">→</span>
        <span class="emotion-path-item">${spec.label}</span>
      </div>
      <div class="sheet-section-title">Be more specific (Step 3/3)</div>
      <div class="emotion-grid" style="grid-template-columns:1fr 1fr">`;
    Object.entries(spec.children).forEach(([k,v])=>{
      html+=`<button class="emotion-btn${selectedNuanced===k?' selected':''}" onclick="selectNuanced('${k}')">
        <span class="emo-label">${v}</span></button>`;
    });
    html+='</div></div>';
    return html;
  }
  return '';
}
function selectCore(k){ selectedCore=k; selectedSpecific=null; selectedNuanced=null; emotionStep=1; renderCheckinSheet(); }
function selectSpecific(k){ selectedSpecific=k; selectedNuanced=null; emotionStep=2; renderCheckinSheet(); }
function selectNuanced(k){ selectedNuanced=k; renderCheckinSheet(); }
function saveCheckin(){
  if(!selectedMood){ showToast('Please select a mood',{icon:'⚠️'}); haptic('error'); return; }
  if(!selectedCore){ showToast('Please select an emotion',{icon:'⚠️'}); haptic('error'); return; }
  const activityEl=document.getElementById('activityInput');
  const activity=activityEl?activityEl.value.trim():'';
  const entry={
    mood: selectedMood,
    core: selectedCore,
    specific: selectedSpecific||selectedCore,
    nuanced: selectedNuanced||selectedSpecific||selectedCore,
    activity: activity
  };
  const data=loadData();
  setEntry(data,editingDate,editingSlot,entry);
  saveData(data);
  haptic('light');
  showToast(`${MOOD_FACES[selectedMood]} ${selectedMood} logged`,{icon:'✓'});
  syncUp();
  closeSheet();
  renderToday();
}
function renderHistory(){
  const data=loadData();
  const container=document.getElementById('historyContent');
  const dates=Object.keys(data.entries).sort().reverse();
  if(!dates.length){
    container.innerHTML=`<div class="section"><div class="empty-state">
      <svg class="empty-illustration" viewBox="0 0 120 120" fill="none"><rect x="25" y="20" width="70" height="80" rx="8" stroke="rgba(216,180,254,.3)" stroke-width="1.5"/><line x1="40" y1="40" x2="80" y2="40" stroke="rgba(216,180,254,.2)" stroke-width="2" stroke-linecap="round"/><line x1="40" y1="55" x2="70" y2="55" stroke="rgba(216,180,254,.15)" stroke-width="2" stroke-linecap="round"/><line x1="40" y1="70" x2="75" y2="70" stroke="rgba(216,180,254,.15)" stroke-width="2" stroke-linecap="round"/><circle cx="90" cy="90" r="12" fill="rgba(216,180,254,.15)"/><path d="M86 90l3 3 5-6" stroke="rgba(216,180,254,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="empty-title">Your story begins here</div>
      <div class="empty-text">Each entry you make becomes a chapter in understanding yourself.</div>
    </div></div>`;
    return;
  }
  let html='<div class="section"><div class="section-title">Past Entries</div>';
  dates.forEach(date=>{
    const dayEntries=data.entries[date];
    const filled=SLOTS.filter(s=>dayEntries[s.key]).length;
    html+=`<div class="history-day-group"><div class="history-day-header">${formatDate(date)} <span>${filled} of 4</span></div>`;
    SLOTS.forEach(s=>{
      const e=dayEntries[s.key];
      if(e){
        html+=`<div class="history-entry" onclick="openCheckin('${date}','${s.key}')">
          <div class="history-time">${s.time.replace(':00','')}</div>
          <div class="history-mood-orb ${e.mood}">${MOOD_FACES[e.mood]}</div>
          <div class="history-info">
            <div class="history-emotion">${e.nuanced||e.specific||e.core}</div>
            ${e.activity?`<div class="history-activity">${escHtml(e.activity)}</div>`:''}
          </div>
        </div>`;
      }
    });
    html+='</div>';
  });
  html+='</div>';
  container.innerHTML=html;
}
</script>
</body>
</html>
